<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>D&C MediaHouse | Cinematic Videography Portfolio</title>
  <meta name="title" content="D&C MediaHouse | Cinematic Videography Portfolio" />
  <meta name="description" content="Explore D&C MediaHouse, a professional cinematic videography and media portfolio featuring high-performance adaptive video streaming." />
  <meta name="keywords" content="cinematic video production, event cinematography, commercial filmmaker, brand story videos, fashion videos, Saksham Chaudhary, D&C MediaHouse, premium video agency" />
  <meta name="author" content="Saksham Chaudhary" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#000000" />
  
  <!-- Canonical URL (Placeholder: replace with actual domain when going live) -->
  <link rel="canonical" href="https://dcmediahouse.in/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://dcmediahouse.in" />
  <meta property="og:title" content="D&C MediaHouse | Cinematic Videography Portfolio" />
  <meta property="og:description" content="Explore D&C MediaHouse, a professional cinematic videography and media portfolio featuring high-performance adaptive video streaming." />
  <meta property="og:image" content="https://dcmediahouse.in/apple-touch-icon.png" />
  <meta property="og:site_name" content="D&C MediaHouse" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://dcmediahouse.in" />
  <meta property="twitter:title" content="D&C MediaHouse | Cinematic Videography Portfolio" />
  <meta property="twitter:description" content="Explore D&C MediaHouse, a professional cinematic videography and media portfolio featuring high-performance adaptive video streaming." />
  <meta property="twitter:image" content="https://dcmediahouse.in/apple-touch-icon.png" />

  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- JSON-LD Structured Data for Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "D&C MediaHouse",
    "url": "https://dcmediahouse.in",
    "description": "Professional cinematic videography portfolio based in New Delhi, featuring high-performance media streaming.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "New Delhi",
      "addressRegion": "Delhi",
      "addressCountry": "IN"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload the LCP-critical font (Inter 700) directly — skips CSS→WOFF2 roundtrip -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="https://fonts.gstatic.com/s/inter/v18/UcCo3FwrK3iLTcviYwYZ90Ru.woff2" />

  <!-- Preload critical fonts with font-display:swap to prevent FOIT -->
  <!-- Trimmed unused Cormorant weights (500, 1;500) to reduce font payload -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" />
  </noscript>

  <!-- DNS Prefetch for contact form endpoint -->
  <link rel="dns-prefetch" href="https://formsubmit.co" />
</head>

<body>
  <div id="root"></div>
  <!-- Preload main module so the browser starts fetching the JS bundle graph early -->
  <link rel="modulepreload" href="/src/main.tsx" />
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
