<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&C MediaHouse — Cinematic Storytelling</title>

  <!-- SEO Meta -->
  <meta name="description" content="D&C MediaHouse — We Don't Shoot Videos. We Tell Stories. Premium cinematic production for events, brands, and commercials." />
  <meta name="theme-color" content="#2D2926" />
  <meta property="og:title" content="D&C MediaHouse" />
  <meta property="og:description" content="Cinematic storytelling for events, brands, and commercials." />
  <meta property="og:type" content="website" />

  <!-- Preconnect: eliminate DNS + TLS latency for fonts (~150-300ms saved) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload critical fonts with font-display:swap to prevent FOIT -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" /></noscript>

  <!-- DNS Prefetch for contact form endpoint -->
  <link rel="dns-prefetch" href="https://formsubmit.co" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
